services:
  llmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmark
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
    volumes:
      - llmark_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  llmark_data:
    driver: local
