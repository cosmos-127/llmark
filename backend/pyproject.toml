[project]
name = "llmark-backend"
version = "0.1.0"
description = "LLMark Backend - The Postman for LLM Endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "numpy>=2.1.0",
    "structlog>=24.4.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "tiktoken>=0.8.0",
    "reportlab>=4.2.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # Line too long (handled by formatter where possible)
    "UP042", # Class inherits from both str and Enum (pydantic/FastAPI schema compatibility)
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends/Query pattern)
    "B904",  # Within an except clause, raise exceptions with raise ... from err
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["call-arg", "arg-type", "assignment", "call-overload", "union-attr"]




