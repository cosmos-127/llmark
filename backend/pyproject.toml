[project]
name = "llmark-backend"
version = "0.1.0"
description = "LLMark Backend - The Postman for LLM Endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
    "numpy>=2.5.2",
    "structlog>=26.1.0",
    "openai>=3.7.0",
    "anthropic>=1.3.0",
    "tiktoken>=0.12.0",
    "reportlab>=5.0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "types-reportlab>=4.5.1.20260807",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # Line too long (handled by formatter where possible)
    "UP042", # Class inherits from both str and Enum (pydantic/FastAPI schema compatibility)
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends/Query pattern)
    "B904",  # Within an except clause, raise exceptions with raise ... from err
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["call-arg", "arg-type", "assignment", "call-overload", "union-attr"]




